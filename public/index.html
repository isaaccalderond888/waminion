<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Triage</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    header {
      padding: 20px 32px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; color: #fff; }

    #status-bar {
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      background: #222;
      color: #aaa;
    }
    #status-bar.ready { background: #1a3a1a; color: #4caf50; }
    #status-bar.qr { background: #1a2a3a; color: #64b5f6; }
    #status-bar.scanning { background: #2a2a1a; color: #ffb74d; }
    #status-bar.error { background: #3a1a1a; color: #ef5350; }

    main { max-width: 800px; margin: 0 auto; padding: 32px 16px; }

    #qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 48px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
    }

    #qr-section p { color: #888; font-size: 0.9rem; text-align: center; }
    #qr-container { background: white; padding: 16px; border-radius: 12px; }

    #connect-section {
      text-align: center;
      padding: 48px;
      background: #1a1a1a;
      border-radius: 16px;
      border: 1px solid #2a2a2a;
    }

    #connect-section p { color: #888; margin-bottom: 24px; font-size: 0.95rem; }

    button#btn-triage {
      background: #25d366;
      color: #000;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button#btn-triage:hover { opacity: 0.85; }
    button#btn-triage:disabled { opacity: 0.4; cursor: not-allowed; }

    #loading {
      text-align: center;
      padding: 48px;
      color: #888;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #report-section { display: flex; flex-direction: column; gap: 12px; }

    .summary-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .summary-pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .report-header h2 { font-size: 1rem; color: #aaa; font-weight: 400; }

    button#btn-refresh {
      background: transparent;
      color: #25d366;
      border: 1px solid #25d366;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button#btn-refresh:hover { background: #1a3a1a; }

    .group-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      margin-top: 16px;
      margin-bottom: 6px;
      padding-left: 4px;
    }

    .chat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .chat-card:hover { border-color: #3a3a3a; }
    .chat-card.urgente { border-left: 3px solid #ef5350; }
    .chat-card.gestion { border-left: 3px solid #ffb74d; }
    .chat-card.info    { border-left: 3px solid #4caf50; }
    .chat-card.social  { border-left: 3px solid #555; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-name { font-weight: 600; font-size: 0.95rem; color: #fff; }

    .card-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .badge.urgente { background: #3a1a1a; color: #ef5350; }
    .badge.gestion { background: #2a2010; color: #ffb74d; }
    .badge.info    { background: #1a2a1a; color: #4caf50; }
    .badge.social  { background: #1e1e1e; color: #777; }

    .days-label { font-size: 0.75rem; color: #666; }

    .card-summary { font-size: 0.88rem; color: #ccc; line-height: 1.4; }
    .card-reason  { font-size: 0.78rem; color: #666; font-style: italic; }

    .card-context {
      margin-top: 4px;
      border-top: 1px solid #222;
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-line {
      font-size: 0.78rem;
      line-height: 1.4;
      display: flex;
      gap: 6px;
    }
    .msg-who { font-weight: 600; flex-shrink: 0; }
    .msg-who.me    { color: #64b5f6; }
    .msg-who.them  { color: #81c784; }
    .msg-body { color: #999; }
    .msg-body.media { color: #666; font-style: italic; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>📋 WA Triage</h1>
  <span id="status-bar">Conectando...</span>
</header>

<main>
  <div id="qr-section" class="hidden">
    <p>Escanea con WhatsApp Business → Dispositivos vinculados → Vincular dispositivo</p>
    <div id="qr-container"></div>
  </div>

  <div id="connect-section" class="hidden">
    <p>WhatsApp conectado. Listo para analizar tus mensajes de los últimos 7 días.</p>
    <button id="btn-triage">Generar reporte de triaje</button>
  </div>

  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <p id="loading-msg">Cargando chats...</p>
  </div>

  <div id="report-section" class="hidden"></div>
</main>

<script>
const socket = io();

const qrSection     = document.getElementById('qr-section');
const connectSection = document.getElementById('connect-section');
const loading       = document.getElementById('loading');
const loadingMsg    = document.getElementById('loading-msg');
const reportSection = document.getElementById('report-section');
const statusBar     = document.getElementById('status-bar');
const btnTriage     = document.getElementById('btn-triage');

function showOnly(el) {
  [qrSection, connectSection, loading, reportSection].forEach(e => e.classList.add('hidden'));
  if (el) el.classList.remove('hidden');
}

socket.on('status', ({ type, message }) => {
  statusBar.textContent = message;
  statusBar.className = '';
  statusBar.classList.add(type);
  loadingMsg.textContent = message;

  if (type === 'ready') {
    // only show connect screen if there's no report showing
    if (!reportSection.classList.contains('hidden')) return;
    showOnly(connectSection);
    btnTriage.disabled = false;
  } else if (type === 'scanning') {
    showOnly(loading);
  } else if (type === 'qr') {
    showOnly(qrSection);
  }
});

socket.on('qr', (qrData) => {
  document.getElementById('qr-container').innerHTML = '';
  new QRCode(document.getElementById('qr-container'), {
    text: qrData,
    width: 220,
    height: 220,
    colorDark: '#000',
    colorLight: '#fff',
  });
  showOnly(qrSection);
});

btnTriage.addEventListener('click', () => {
  btnTriage.disabled = true;
  showOnly(loading);
  socket.emit('start_triage');
});

socket.on('report', (chats) => {
  console.log('Reporte recibido:', chats.length, 'chats', JSON.stringify(chats).slice(0, 300));
  try {
    renderReport(chats);
    showOnly(reportSection);
  } catch(e) {
    console.error('Error en renderReport:', e);
    reportSection.innerHTML = '<p style="color:red;padding:24px">Error al renderizar: ' + e.message + '</p>';
    showOnly(reportSection);
  }
});

function renderReport(chats) {
  const urgentes = chats.filter(c => c.categoria === 'URGENTE');
  const gestion  = chats.filter(c => c.categoria === 'GESTION');
  const info     = chats.filter(c => c.categoria === 'INFO');
  const social   = chats.filter(c => c.categoria === 'SOCIAL');

  let html = `
    <div class="report-header">
      <h2>Reporte — ${new Date().toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'})}</h2>
      <button id="btn-refresh">↺ Actualizar</button>
    </div>
    <div class="summary-bar">
      <span class="summary-pill">Total: ${chats.length}</span>
      <span class="summary-pill" style="color:#ef5350">🔴 ${urgentes.length} urgentes</span>
      <span class="summary-pill" style="color:#ffb74d">🟡 ${gestion.length} gestión</span>
      <span class="summary-pill" style="color:#4caf50">🟢 ${info.length} info</span>
      <span class="summary-pill" style="color:#777">⚪ ${social.length} social</span>
    </div>
  `;

  const groups = [
    { label: '🔴 Urgentes', items: urgentes, cat: 'urgente' },
    { label: '🟡 Gestión', items: gestion, cat: 'gestion' },
    { label: '🟢 Info', items: info, cat: 'info' },
    { label: '⚪ Social', items: social, cat: 'social' },
  ];

  for (const group of groups) {
    if (group.items.length === 0) continue;
    html += `<div class="group-label">${group.label}</div>`;
    for (const chat of group.items) {
      const daysText = chat.daysPending === 0 ? 'hoy'
        : chat.daysPending === 1 ? 'hace 1 día'
        : `hace ${chat.daysPending} días`;

      const contextHtml = chat.recentMessages.map(m => {
        const isMedia = ['ptt','image','video','document','sticker'].includes(m.type) || m.body.startsWith('[');
        return `<div class="msg-line">
          <span class="msg-who ${m.fromMe ? 'me' : 'them'}">${m.fromMe ? 'Tú' : chat.name.split(' ')[0]}:</span>
          <span class="msg-body ${isMedia ? 'media' : ''}">${escHtml(m.body)}</span>
        </div>`;
      }).join('');

      html += `
        <div class="chat-card ${group.cat}">
          <div class="card-top">
            <span class="card-name">${escHtml(chat.name)}</span>
            <div class="card-meta">
              <span class="days-label">${daysText}</span>
              <span class="badge ${group.cat}">${chat.emoji} ${group.cat.toUpperCase()}</span>
            </div>
          </div>
          <div class="card-summary">${escHtml(chat.lastMessage)}</div>
          ${chat.razon ? `<div class="card-reason">${escHtml(chat.razon)}</div>` : ''}
          <div class="card-context">${contextHtml}</div>
        </div>`;
    }
  }

  reportSection.innerHTML = html;

  document.getElementById('btn-refresh').addEventListener('click', () => {
    showOnly(connectSection);
    btnTriage.disabled = false;
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
</html>
